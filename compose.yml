services:
  web:
    image: nginx:alpine
    container_name: web
    restart: unless-stopped
    volumes:
      - ./docs:/var/www/html:ro
      - ./container-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    ports:
      - "8080-65535:80"
  cron-web:
    image: alpine
    # curlをインストール後、whileループで60秒ごとにcurlを実行し続ける
    command: >
      sh -c "
      apk --no-cache add curl jq &&
      sleep 10 &&
      while :; do
        curl -s -L http://web/ | jq -c '.[] | [.enka.uid, .hoyolab.current_resin, .hoyolab.max_resin, .hoyolab.resin_recovery_time] | [.[] | tonumber]';
        sleep 30;
      done
      "
    restart: unless-stopped
    depends_on:
      - web
  app:
    build:
      context: .
      dockerfile: ./container-app-build/Dockerfile
    restart: unless-stopped
    volumes:
      - ./container-app:/app:ro
      - ./docs:/var/www/html:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      GOOGLE_RECAPTCHA_SITE_KEY: "${GOOGLE_RECAPTCHA_SITE_KEY:-null}"
      GOOGLE_RECAPTCHA_SECRET_KEY: "${GOOGLE_RECAPTCHA_SECRET_KEY:-null}"
      IPINFO_TOKEN: "${IPINFO_TOKEN:-null}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-null}"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./container-db-build:/docker-entrypoint-initdb.d/
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - database
  db_admin:
    image: dpage/pgadmin4:latest
    restart: no
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${INTERNAL_PGADMIN_EMAIL:-sqladmin@localhost.local}
      PGADMIN_DEFAULT_PASSWORD: ${INTERNAL_PGADMIN_PASSWORD:-password}
    volumes:
      - pgadmin-store:/var/lib/pgadmin
    depends_on:
      - db
volumes:
  pgdata:
  pgadmin-store:
