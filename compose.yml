services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docs:/var/www/html:ro
      - ./container-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    profiles:
      - all
      - web
  cron-web:
    image: alpine
    # curlをインストール後、whileループで60秒ごとにcurlを実行し続ける
    command: >
      sh -c "
      apk --no-cache add curl jq &&
      sleep 10 &&
      while :; do
        curl -s -L http://web/ | jq -c '.[].hoyolab | [.current_resin, .max_resin, .resin_recovery_time] | [.[] | tonumber]';
        sleep 30;
      done
      "
    restart: unless-stopped
    depends_on:
      - web
    profiles:
      - all
      - web
  app:
    build:
      context: .
      dockerfile: ./container-app-build/Dockerfile
    restart: unless-stopped
    volumes:
      - ./container-app:/app:ro
      - ./docs:/var/www/html:ro
    environment:
      GOOGLE_RECAPTCHA_SITE_KEY: "${GOOGLE_RECAPTCHA_SITE_KEY:-null}"
      GOOGLE_RECAPTCHA_SECRET_KEY: "${GOOGLE_RECAPTCHA_SECRET_KEY:-null}"
      IPINFO_TOKEN: "${IPINFO_TOKEN:-null}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-null}"
