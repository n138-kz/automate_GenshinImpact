		progress {
			/* ブラウザ標準のデザインをリセット */
			-webkit-appearance: none;
			appearance: none;
			height: 20px;
			max-width: 200px;
		}
		progress::-webkit-progress-bar {
			/* 背景色（トラック部分） */
			background-color: #eee;
			border-radius: 4px;
		}

		progress::-webkit-progress-value {
			/* デフォルトのバーの色（例: 青） */
			background-color: #007bff;
			border-radius: 4px;
			transition: background-color 0.3s ease;
		}

		progress[data-status="warning"]::-webkit-progress-value {
			/* 条件ごとの色変更 */
			background-color: orange; /* 0.8超〜0.9以下: 黄色 */
		}

		progress[data-status="danger"]::-webkit-progress-value {
			/* 条件ごとの色変更 */
			background-color: red; /* 0.9超: 赤色 */
		}
	</style>

		document.addEventListener('change', (e)=>{
			if(e.target.tagName.toLocaleLowerCase()!=='input'){return;}

			if(typeof e.target.dataset.uid === 'undefined'){return;}
			
			Array.from(document.querySelectorAll(`.history_${e.target.dataset.uid}`)).forEach((e2)=>{
				if(e.target.checked){

				}else{
					e2.style.display='none';
				}
			});
		});

						dom.pop();
					}
					{
						dom[dom.length]=document.createElement('td');
						{
							dom[dom.length]=document.createElement('table');
							dom[dom.length-1].style.width='100%';
							{
								dom[dom.length]=document.createElement('tr');
								{
									dom[dom.length]=document.createElement('td');
									{
										dom[dom.length]=document.createElement('progress');
										dom[dom.length-1].value=(e.current_resin/e.max_resin)||0;
										dom[dom.length-1].dataset.status='';
										if(false){
										}else if(dom[dom.length-1].value>=0.9){
											dom[dom.length-1].dataset.status='danger';
										}else if(dom[dom.length-1].value>=0.8){
											dom[dom.length-1].dataset.status='warning';
										}
										dom[dom.length-2].appendChild(dom[dom.length-1]);
										dom.pop();
									}
									dom[dom.length-2].appendChild(dom[dom.length-1]);
									dom.pop();
								}
								{
									dom[dom.length]=document.createElement('td');
									dom[dom.length-1].style.textAlign='right';
									{
										dom[dom.length]=document.createTextNode(`${(((e.current_resin/e.max_resin)||0)*100).toFixed(2)}%`);
										dom[dom.length-2].appendChild(dom[dom.length-1]);
										dom.pop();
									}
									dom[dom.length-2].appendChild(dom[dom.length-1]);
									dom.pop();
								}
								dom[dom.length-2].appendChild(dom[dom.length-1]);
								dom.pop();
							}
							dom[dom.length-2].appendChild(dom[dom.length-1]);
							dom.pop();
						}
						dom[dom.length-2].appendChild(dom[dom.length-1]);
						dom.pop();
					}
					{
						dom[dom.length]=document.createElement('td');
						{
							let expire_at=new Date(e.full_recovery_at);
							expire_at=`${expire_at.getMonth()+1}/${expire_at.getDate()} ${expire_at.getHours()}:${String(expire_at.getMinutes()).padStart(2, '0')}:${String(expire_at.getSeconds()).padStart(2, '0')}`;

							dom[dom.length]=document.createTextNode(expire_at);
							dom[dom.length-2].appendChild(dom[dom.length-1]);
							dom.pop();
						}
						dom[dom.length-2].appendChild(dom[dom.length-1]);
						dom.pop();
					}
					output.appendChild(dom[0]);
				});
			}
		}
		window.addEventListener('DOMContentLoaded', async ()=>{
			loop1();
			setInterval(loop1, 30*10**3);
		});
	</script>
</head>
<body>
	<div id="output">
		<table border=1>
			<thead>
				<tr>
					<td></td>
					<th>updated_at</th>
					<th>player_name</th>
					<th>player_signature</th>
					<th>enka_uid</th>
					<th>current_resin</th>
					<th>max_resin</th>
					<th>current_resin_percent</th>
					<th>resin_recovery_time</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
	</div>
</body>
</html>
